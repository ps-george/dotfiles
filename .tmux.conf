# split panes using | and -, opening in @workdir (see status-right below) so a
# new split follows wherever work actually is, not the pane's stale real cwd
bind | run-shell 'wd=$(tmux show-options -p -v @workdir); tmux split-window -h -c "$wd"; tmux set-option -p @workdir "$wd"'
bind - run-shell 'wd=$(tmux show-options -p -v @workdir); tmux split-window -v -c "$wd"; tmux set-option -p @workdir "$wd"'
unbind '"'
unbind %
# Enable mouse mode (tmux 2.1 and above)
set -g mouse on
# mac, use zsh
set-option -g default-shell "/bin/zsh"
set-option -g history-limit 50000
# Rebind leader key to C-a 
set -g prefix2 C-a                       # GNU-Screen compatible prefix
bind C-a send-prefix -2
bind-key -n C-b send-prefix
# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf
# fix vim background colour
set -g default-terminal "screen-256color"
# vim keybinds for navigating panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g renumber-windows on

# copy-mode for copying from vim
setw -g mode-keys vi
unbind [
bind y copy-mode
unbind p
bind p paste-buffer
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection

# status-right: git branch/dirty/ahead-behind + dev-ports sim lease for @workdir,
# a pane-local variable (not pane_current_path — agent tool calls use absolute
# paths and never actually `cd` the pane, so pane_current_path goes stale the
# moment work moves to a different worktree/branch). Default to the pane's
# actual start dir; update explicitly via `tmux set-option -p @workdir <path>`
# whenever work moves elsewhere.
set -g @workdir "#{pane_current_path}"
set -g status-interval 5
set -g status-right-length 60
set -g status-right '#[fg=black,bold]git:#(cd #{@workdir} && git branch --show-current 2>/dev/null)#[fg=colour88]#(cd #{@workdir} && git status --porcelain 2>/dev/null | grep -q . && echo "*")#[fg=colour24]#(cd #{@workdir} && git rev-list --left-right --count @{u}...HEAD 2>/dev/null | awk "{if (\$1>0) printf \" ↓%s\", \$1; if (\$2>0) printf \" ↑%s\", \$2}") #[fg=colour233,nobold]· #[fg=colour52,bold]sim:#(test -f #{@workdir}/.dev-ports && grep SIM_NAME #{@workdir}/.dev-ports | cut -d= -f2)#[fg=colour233,nobold] %H:%M '

